
<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Stream</title>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@1"></script>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#050914] text-white min-h-screen">

    <div class="flex flex-col md:flex-row min-h-screen">

        <aside class="w-full md:w-80 bg-[#111827] p-4">

            <h1 class="text-xl font-bold mb-4">Smart Stream</h1>

            <div class="relative mb-4">
                <span class="absolute left-3 top-3 text-gray-400">⌕</span>
                <input
                id="search-input"
                    type="text"
                    placeholder="Recherche TV en direct"
                    class="w-full bg-[#1f2937] rounded-lg py-3 pl-10 pr-3 text-sm outline-none focus:ring-2 focus:ring-blue-500"
                >
            </div>
            <button id="back-btn" class="hidden mb-3 text-sm text-blue-400">← Retour aux pays</button>

            <h2 class="text-xs font-semibold tracking-wider text-gray-400 mb-4">
                DOCUMENTAIRE
            </h2>
            <div id="list" class="flex flex-col gap-2 overflow-y-auto max-h-[calc(100vh-180px)] scrollbar-thumb-gray-950">


            </div>

            
        </aside>

        <main class="flex-1 p-4 md:p-6">

            <section id="preview-container" class="relative aspect-video bg-[#1f2937] rounded-xl flex items-center justify-center">

               

                <span class="text-gray-400 text-sm">

                    TV
                
                </span>

            </section>

            

        </main>

    </div>
    <script type="module" src="./js/main.js"></script>

</body>
</html>
